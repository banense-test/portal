# Employee Portal — CI baseline (CON-033)
#
# Build and test run on the hosted SCM provider's CI. CI never holds production
# data or credentials and never deploys; Infrastructure deploys (CON-033, CON-036).
#
# Stack: .NET 10 (CON-027), Razor Pages (CON-028), REST API (CON-027),
# PostgreSQL 18 (CON-029). This baseline pipeline does not exercise the database;
# the first migration and its test arrive with the first subsystem.
#
# The solution manifest is REGENERATED from the src/ + tests/ tree on every run, so
# a subsystem merged under src/ can never be silently disconnected from CI.
#
# Integration order follows the subsystem dependency hierarchy of the Software
# Architecture Document (Logical View), bottom-up: a subsystem is merged only after
# every subsystem it depends on is already on the iteration branch. The hierarchy
# below is the Software Architecture Document's, not a provisional sketch.
#
#   @startuml
#   title Portal — subsystem dependency hierarchy (integration order)
#   skinparam componentStyle rectangle
#   component "COMP-007 Audit Trail" as C7
#   component "COMP-008 Identity and Access" as C8
#   component "COMP-009 People Directory Port" as C9
#   component "COMP-010 Clocking Retry Queue" as C10
#   component "COMP-001 Clocking" as C1
#   component "COMP-004 News Featuring" as C4
#   component "COMP-006 Worker Category" as C6
#   component "COMP-002 Clocking Reporting" as C2
#   component "COMP-003 News" as C3
#   component "COMP-005 Directory" as C5
#   C1 --> C7
#   C1 --> C8
#   C2 --> C1
#   C2 --> C6
#   C2 --> C9
#   C2 --> C8
#   C3 --> C4
#   C3 --> C7
#   C3 --> C8
#   C4 --> C7
#   C4 --> C8
#   C5 --> C9
#   C5 --> C6
#   C5 --> C8
#   C6 --> C7
#   C6 --> C8
#   @enduml
#
# Merge order, leaves first: COMP-007, COMP-008, COMP-009, COMP-010, then
# COMP-001, COMP-004, COMP-006, then COMP-002, COMP-003, COMP-005.
#
# Target build frequency: at least one build per day toward iteration close, one
# per week minimum — the Integrator's merge cadence.

name: CI

on:
  push:
    branches:
      - main
      - 'iteration/**'
      - 'chore/**'
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - 'iteration/**'
      - 'chore/**'
      - 'feature/**'
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION_FILE: 'Portal.sln'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Sync solution manifest with the src/ and tests/ tree
        shell: bash
        run: |
          set -euo pipefail
          dotnet new sln --name Portal --force > /dev/null
          mapfile -t PROJECTS < <(find src tests -name '*.csproj' \
            -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "::error::No .csproj found under src/ or tests/ — the build would compile nothing."
            exit 1
          fi
          for project in "${PROJECTS[@]}"; do
            dotnet sln "$SOLUTION_FILE" add "$project" > /dev/null
          done
          echo "Solution manifest synced with ${#PROJECTS[@]} project(s):"
          dotnet sln "$SOLUTION_FILE" list

      - name: Restore
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build
        run: dotnet build "$SOLUTION_FILE" --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Sync solution manifest with the src/ and tests/ tree
        shell: bash
        run: |
          set -euo pipefail
          dotnet new sln --name Portal --force > /dev/null
          mapfile -t PROJECTS < <(find src tests -name '*.csproj' \
            -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if [ "${#PROJECTS[@]}" -eq 0 ]; then
            echo "::error::No .csproj found under src/ or tests/ — the test job would run nothing."
            exit 1
          fi
          for project in "${PROJECTS[@]}"; do
            dotnet sln "$SOLUTION_FILE" add "$project" > /dev/null
          done

      - name: Test
        run: >
          dotnet test "$SOLUTION_FILE"
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore
          retention-days: 7
