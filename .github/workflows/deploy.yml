# Skeleton CI/CD workflow for Portal deployment
# To be refined in Elaboration/Transition once the Windows Server target is confirmed.
name: portal-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Publish artifact
        run: dotnet publish --configuration Release --output ./publish
      # TODO: upload publish folder to internal artifact store

  deploy-staging:
    needs: build
    runs-on: windows-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        run: echo 'TODO: invoke infra/deploy.ps1 against Staging server'

  deploy-production:
    needs: deploy-staging
    runs-on: windows-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: echo 'TODO: invoke infra/deploy.ps1 against Production server'
